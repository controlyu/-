<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>七夕快乐，我的唯一</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #fff; }
        .screen-wrapper { position: relative; width: 100%; height: 100%; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; background: #000; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .tip { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 3vw !important; font-weight: 500; letter-spacing: 2px; opacity: 0.9; z-index: 3; pointer-events: none; text-shadow: 0 0 10px rgba(255, 117, 140, 0.8), 0 2px 4px rgba(0,0,0,0.6); transition: opacity 0.5s ease; white-space: nowrap; }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .heart-box { position: relative; width: 100vw; height: 100vw; display: flex; justify-content: center; align-items: center; animation: pulse 1.5s infinite ease-in-out; margin-bottom: 20px; }
        .heart-box::before, .heart-box::after { content: ""; position: absolute; top: 0; width: 50%; height: 80%; background: #ff4d6d; border-radius: 50vw 50vw 0 0; }
        .heart-box::before { left: 50%; transform: rotate(-45deg); transform-origin: 0 100%; }
        .heart-box::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
        .heart-text { position: relative; z-index: 2; color: #fff; font-size: 12vw; font-weight: bold; text-align: center; line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,0.6); word-break: keep-all; margin-top: -2em; }
        .btn-group { display: flex; gap: 20px; z-index: 11; }
        .choice-btn { padding: 20px 30px; width: 40vw; font-size: 6vw; font-weight: bold; color: #fff; border: none; border-radius: 50px; cursor: pointer; outline: none; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: float 3s ease-in-out infinite; }
        .btn-like { background: linear-gradient(45deg, #ff758c, #ff7eb3); }
        .btn-like:hover, .btn-like:active { background: linear-gradient(45deg, #ff4d6d, #ff758c); transform: scale(1.1); box-shadow: 0 0 20px rgba(255, 77, 109, 0.8); }
        .btn-dislike { background: linear-gradient(45deg, #8e9aaf, #b8c6db); animation-delay: 1.5s; }
        .btn-dislike:hover, .btn-dislike:active { background: linear-gradient(45deg, #9b72cf, #b8c6db); transform: scale(1.1); box-shadow: 0 0 20px rgba(155, 114, 207, 0.8); }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>
<div class="screen-wrapper">
    <video id="myVideo" playsinline webkit-playsinline muted preload="auto">
        <source src="renxi/love.mp4" type="video/mp4">
    </video>
    <audio id="myAudio" loop preload="auto">
        <source src="renxi/love1.mp3" type="audio/mpeg">
    </audio>
    <canvas id="heartCanvas"></canvas>
    <div class="tip" id="tipText">💌 小猪猪快点点一下</div>

    <div class="modal-overlay" id="endModal">
        <div class="heart-box">
            <span class="heart-text">小宝<br>专属链接</span>
        </div>
        <div class="btn-group">
            <button class="choice-btn btn-like" id="btnLike">喜欢 💖</button>
            <button class="choice-btn btn-dislike" id="btnDislike">不喜欢 😤</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('myVideo');
    const audio = document.getElementById('myAudio');
    const tip = document.getElementById('tipText');
    const endModal = document.getElementById('endModal');
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, hearts = [];

    document.body.addEventListener('click', (e) => {
        if (e.target.closest('.modal-overlay')) return;
        if (video.paused) {
            const videoPromise = video.play();
            if (videoPromise !== undefined) {
                videoPromise.then(() => {
                    const audioPromise = audio.play();
                    if (audioPromise !== undefined) audioPromise.catch(() => {});
                    tip.style.opacity = '0';
                }).catch(() => {});
            }
        } else {
            video.pause(); audio.pause(); tip.style.opacity = '0.9';
        }
    });

    video.addEventListener('play', () => { if (Math.abs(video.currentTime - audio.currentTime) > 0.5) audio.currentTime = video.currentTime; });
    video.addEventListener('pause', () => { if (!audio.paused) audio.pause(); });
    video.addEventListener('ended', () => showEndModal());
    let hasShownModal = false;
    setInterval(() => { if (video.currentTime >= video.duration && video.duration > 0 && !hasShownModal) showEndModal(); }, 500);

    function showEndModal() {
        if (hasShownModal) return;
        hasShownModal = true;
        audio.pause();
        endModal.classList.add('show');
    }

    const btnLike = document.getElementById('btnLike');
    const btnDislike = document.getElementById('btnDislike');

    // 🌟 修复：用普通字符串拼接代替模板字符串，彻底避免嵌套解析报错
    function getLikePageHTML() {
        return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">' +
            '<style>' +
            'body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 99%,#fecfef 100%);overflow:hidden;position:relative}' +
            '.text{font-size:12vw;font-weight:bold;color:#fff;text-align:center;z-index:2;text-shadow:0 0 20px rgba(255,77,109,0.8);animation:breathe 2s infinite ease-in-out;line-height:1.4}' +
            '.rain{position:absolute;top:-50px;font-size:6vw;animation:fall linear infinite;opacity:0.8;z-index:1}' +
            '@keyframes breathe{0%,100%{transform:scale(1);opacity:0.9}50%{transform:scale(1.1);opacity:1}}' +
            '@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}' +
            '</style></head><body>' +
            '<div class="text">算你识相 💖<br>永远爱你</div>' +
            '<script>' +
            'var emojis=["💖","💕","✨","🌸"];for(var i=0;i<30;i++){var el=document.createElement("div");el.className="rain";el.innerText=emojis[Math.floor(Math.random()*4)];el.style.left=Math.random()*100+"vw";el.style.animationDuration=(Math.random()*3+2)+"s";el.style.animationDelay=Math.random()*5+"s";document.body.appendChild(el)}' +
            '<\/script></body></html>';
    }

    function getDislikePageHTML() {
        return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">' +
            '<style>' +
            'body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);overflow:hidden;position:relative}' +
            '.text{font-size:10vw;font-weight:bold;color:#e0c3fc;text-align:center;z-index:2;text-shadow:0 0 15px rgba(155,114,207,0.8);animation:tsundere 1s infinite ease-in-out;line-height:1.4}' +
            '.star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;animation:twinkle 2s infinite ease-in-out;z-index:1}' +
            '@keyframes tsundere{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}' +
            '@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:1;transform:scale(2)}}' +
            '</style></head><body>' +
            '<div class="text">不喜欢也得喜欢<br>哼！😤</div>' +
            '<script>' +
            'for(var i=0;i<50;i++){var el=document.createElement("div");el.className="star";el.style.left=Math.random()*100+"vw";el.style.top=Math.random()*100+"vh";el.style.animationDelay=Math.random()*3+"s";document.body.appendChild(el)}' +
            '<\/script></body></html>';
    }

    btnLike.addEventListener('click', () => {
        const blob = new Blob([getLikePageHTML()], { type: 'text/html' });
        window.open(URL.createObjectURL(blob), '_blank');
    });

    btnDislike.addEventListener('click', () => {
        btnDislike.style.animation = 'shake 0.5s ease-in-out';
        setTimeout(() => {
            const blob = new Blob([getDislikePageHTML()], { type: 'text/html' });
            window.open(URL.createObjectURL(blob), '_blank');
        }, 500);
    });

    // 爱心粒子背景
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    class Heart {
        constructor() { this.reset(); }
        reset() { this.x = Math.random() * width; this.y = height + Math.random() * 100; this.size = Math.random() * 15 + 5; this.speedY = Math.random() * 1 + 0.5; this.speedX = Math.random() * 0.5 - 0.25; this.opacity = Math.random() * 0.5 + 0.2; this.color = 'rgba(255,' + Math.floor(Math.random()*100+100) + ',' + Math.floor(Math.random()*100+100) + ',' + this.opacity + ')'; }
        update() { this.y -= this.speedY; this.x += this.speedX; if (this.y < -20) this.reset(); }
        draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.size / 10, this.size / 10); ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-5, -5, -10, 0, 0, 10); ctx.bezierCurveTo(10, 0, 5, -5, 0, 0); ctx.fillStyle = this.color; ctx.fill(); ctx.restore(); }
    }
    for (let i = 0; i < 50; i++) hearts.push(new Heart());
    function animate() { ctx.clearRect(0, 0, width, height); hearts.forEach(h => { h.update(); h.draw(); }); requestAnimationFrame(animate); }
    animate();
</script>
</body>
</html>
