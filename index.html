<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：禁止手机浏览器缩放，适配刘海屏安全区 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>七夕快乐，我的唯一</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
        }
        /* 全屏容器，适配iPhone刘海屏 */
        .screen-wrapper {
            position: relative;
            width: 100%; height: 100%;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        /* 视频全屏铺满，像手机壁纸一样 */
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 1;
        }
        /* 爱心粒子背景画布 */
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none; /* 让点击事件穿透，不影响视频播放 */
        }
        /* 提示文字 - 居中 + 放大 + 发光效果 */
        .tip {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 3vw !important;
            font-weight: 500;
            letter-spacing: 2px;
            opacity: 0.9;
            z-index: 3;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.8), 0 2px 4px rgba(0,0,0,0.6);
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }

        /* ========== 🌟 视频结束弹窗样式 ========== */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10;
            display: flex;
            flex-direction: column; /* 垂直排列：爱心 + 按钮 */
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 🌟 极限放大的爱心容器：占满屏幕宽度 */
        .heart-box {
            position: relative;
            width: 100vw;   /* 极限放大：占满整个屏幕宽度 */
            height: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse 1.5s infinite ease-in-out;
            margin-bottom: 20px;
        }
        .heart-box::before, .heart-box::after {
            content: "";
            position: absolute;
            top: 0;
            width: 50%; height: 80%;
            background: #ff4d6d;
            border-radius: 50vw 50vw 0 0;
        }
        .heart-box::before {
            left: 50%;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .heart-box::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* 🌟 极限放大的文字：拆分为两行，完美嵌入大爱心 */
        .heart-text {
            position: relative;
            z-index: 2;
            color: #fff;
            font-size: 12vw; /* 超大字号 */
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            word-break: keep-all;
        }

        /* ========== 🌟 按钮区域样式：顶格放大 ========== */
        .btn-group {
            display: flex;
            gap: 20px;
            z-index: 11;
        }
        .choice-btn {
            padding: 20px 30px; /* 增加按钮厚度 */
            width: 40vw; /* 按钮宽度占屏幕40% */
            font-size: 6vw; /* 按钮文字超大 */
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        /* 喜欢按钮 */
        .btn-like {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
        }
        .btn-like:hover, .btn-like:active {
            background: linear-gradient(45deg, #ff4d6d, #ff758c);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.8);
        }
        /* 不喜欢按钮 */
        .btn-dislike {
            background: linear-gradient(45deg, #8e9aaf, #b8c6db);
            animation-delay: 1.5s;
        }
        .btn-dislike:hover, .btn-dislike:active {
            background: linear-gradient(45deg, #9b72cf, #b8c6db);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(155, 114, 207, 0.8);
        }

        /* 调皮摇晃动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        /* 心跳脉动动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        /* 按钮浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
<div class="screen-wrapper">
    <!-- ⚠️ 关键修复：去掉了 loop 属性 -->
    <video id="myVideo" playsinline webkit-playsinline muted preload="auto">
        <source src="renxi/love.mp4" type="video/mp4">
    </video>

    <!-- 🎵 背景音乐 -->
    <audio id="myAudio" loop preload="auto">
        <source src="renxi/love1.mp3" type="audio/mpeg">
    </audio>

    <canvas id="heartCanvas"></canvas>
    <div class="tip" id="tipText">💌 小猪猪快点点一下</div>

    <!-- 🌟 视频结束后的弹窗 -->
    <div class="modal-overlay" id="endModal">
        <div class="heart-box">
            <!-- 🌟 拆分为两行，完美嵌入超大爱心 -->
            <span class="heart-text">小宝<br>专属链接</span>
        </div>

        <!-- 🌟 顶格放大的选择按钮 -->
        <div class="btn-group">
            <button class="choice-btn btn-like" id="btnLike">喜欢 💖</button>
            <button class="choice-btn btn-dislike" id="btnDislike">不喜欢 😤</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('myVideo');
    const audio = document.getElementById('myAudio');
    const tip = document.getElementById('tipText');
    const endModal = document.getElementById('endModal');
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, hearts = [];

    // 🌟 核心修复：优化点击播放逻辑
    document.body.addEventListener('click', (e) => {
        if (e.target.closest('.modal-overlay')) return;
        if (video.paused) {
            const videoPromise = video.play();
            if (videoPromise !== undefined) {
                videoPromise.then(() => {
                    const audioPromise = audio.play();
                    if (audioPromise !== undefined) {
                        audioPromise.catch(error => {
                            console.log("音频被拦截，请再次点击屏幕");
                        });
                    }
                    tip.style.opacity = '0';
                }).catch(error => {
                    console.log("视频播放失败:", error);
                });
            }
        } else {
            video.pause();
            audio.pause();
            tip.style.opacity = '0.9';
        }
    });

    // 🎵 优化：防止视频和音频因为网络延迟导致不同步
    video.addEventListener('play', () => {
        if (Math.abs(video.currentTime - audio.currentTime) > 0.5) {
            audio.currentTime = video.currentTime;
        }
    });

    // 视频暂停时，音频也强制暂停
    video.addEventListener('pause', () => {
        if (!audio.paused) audio.pause();
    });

    // 🌟 核心修复：双重保险监听视频结束
    video.addEventListener('ended', () => { showEndModal(); });
    let hasShownModal = false;
    setInterval(() => {
        if (video.currentTime >= video.duration && video.duration > 0 && !hasShownModal) {
            showEndModal();
        }
    }, 500);

    function showEndModal() {
        if (hasShownModal) return;
        hasShownModal = true;
        audio.pause();
        endModal.classList.add('show');
    }

    // ========== 🌟 按钮点击跳转逻辑 ==========
    const btnLike = document.getElementById('btnLike');
    const btnDislike = document.getElementById('btnDislike');

    // 点击“喜欢”：直接跳转
    btnLike.addEventListener('click', () => {
        openResultPage('算你识相 💖');
    });

    // 点击“不喜欢”：先摇晃一下，再跳转
    btnDislike.addEventListener('click', () => {
        btnDislike.style.animation = 'shake 0.5s ease-in-out';
        setTimeout(() => {
            openResultPage('不喜欢也得喜欢，哼！ 😤');
        }, 500);
    });

    // 生成结果页面的函数（无需额外建HTML文件）
    function openResultPage(message) {
        const htmlContent = `
            <html>
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>你的选择</title>
                <style>
                    body {
                        margin: 0; height: 100vh;
                        display: flex; justify-content: center; align-items: center;
                        background: #000; color: #fff;
                        font-family: 'PingFang SC', sans-serif;
                        font-size: 8vw; font-weight: bold;
                        text-align: center; padding: 20px;
                        text-shadow: 0 0 15px rgba(255, 117, 140, 0.8);
                    }
                </style>
            </head>
            <body>${message}</body>
            </html>
        `;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        window.open(URL.createObjectURL(blob), '_blank');
    }

    // 浪漫爱心粒子背景代码
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Heart {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.size = Math.random() * 15 + 5;
            this.speedY = Math.random() * 1 + 0.5;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.opacity = Math.random() * 0.5 + 0.2;
            this.color = `rgba(255, ${Math.floor(Math.random()*100 + 100)}, ${Math.floor(Math.random()*100 + 100)}, ${this.opacity})`;
        }
        update() {
            this.y -= this.speedY;
            this.x += this.speedX;
            if (this.y < -20) this.reset();
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.size / 10, this.size / 10);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-5, -5, -10, 0, 0, 10);
            ctx.bezierCurveTo(10, 0, 5, -5, 0, 0);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    for (let i = 0; i < 50; i++) hearts.push(new Heart());
    function animate() {
        ctx.clearRect(0, 0, width, height);
        hearts.forEach(h => { h.update(); h.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
